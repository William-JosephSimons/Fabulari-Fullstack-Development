<header class="fabulari-header">
  <div class="fabulari-brand">
    <a routerLink="/super-admin-dashboard" aria-label="Go to Super Admin dashboard">
      <img src="/images/fabulari-logo.png" alt="Fabulari - where communities meet" />
    </a>
  </div>

  <nav class="fabulari-nav" aria-label="Super Administrator navigation">
    <a routerLink="/super-admin-dashboard" routerLinkActive="active">
      Super Admin dashboard
    </a>
    <a routerLink="/admin/requests" routerLinkActive="active">Requests</a>
    <a routerLink="/admin/users" routerLinkActive="active">Users</a>
    <a routerLink="/admin/audit-logs" routerLinkActive="active">Audit logs</a>
    <button type="button" (click)="logout()">Logout</button>
  </nav>
</header>
