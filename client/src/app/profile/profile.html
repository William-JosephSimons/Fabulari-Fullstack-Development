<app-main-navigation />

<main class="container py-4 profile-page">
  <section class="card content-card" aria-labelledby="profile-heading">
    <div class="card-body p-4">
      <h1 id="profile-heading" class="h2 mb-4">My Profile</h1>

      <div class="profile-image-section mb-4">
        <div class="profile-avatar" aria-label="Current profile image">B</div>
        <button
          class="btn btn-outline-dark"
          type="button"
          (click)="showLaterFeature('Profile image uploads')"
        >
          Change image
        </button>
      </div>

      <form (ngSubmit)="saveProfile()">
        <div class="row g-3">
          <div class="col-sm-6">
            <label class="form-label" for="profile-first-name">First name</label>
            <input
              id="profile-first-name"
              class="form-control"
              name="firstName"
              [(ngModel)]="profile.firstName"
              required
            />
          </div>

          <div class="col-sm-6">
            <label class="form-label" for="profile-last-name">Last name</label>
            <input
              id="profile-last-name"
              class="form-control"
              name="lastName"
              [(ngModel)]="profile.lastName"
              required
            />
          </div>

          <div class="col-sm-6">
            <label class="form-label" for="profile-username">Username</label>
            <input
              id="profile-username"
              class="form-control"
              name="username"
              [(ngModel)]="profile.username"
              required
            />
          </div>

          <div class="col-sm-6">
            <label class="form-label" for="profile-age">Age</label>
            <input
              id="profile-age"
              class="form-control"
              type="number"
              name="age"
              min="1"
              [(ngModel)]="profile.age"
              required
            />
          </div>

          <div class="col-12">
            <label class="form-label" for="profile-email">Email</label>
            <input
              id="profile-email"
              class="form-control read-only-field"
              type="email"
              [value]="email"
              readonly
            />
            <div class="form-text">Email cannot be changed.</div>
          </div>
        </div>

        @if (profileMessage) {
          <div class="alert alert-success mt-3 mb-0" role="status">{{ profileMessage }}</div>
        }

        <div class="d-flex flex-wrap gap-2 mt-4">
          <button class="btn btn-outline-dark" type="submit">Save changes</button>
          <button
            class="btn btn-outline-dark"
            type="button"
            (click)="showLaterFeature('Password changes')"
          >
            Change password
          </button>
        </div>
      </form>
    </div>
  </section>
</main>
