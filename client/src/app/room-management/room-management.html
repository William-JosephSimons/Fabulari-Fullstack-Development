<app-main-navigation />

<main class="container py-4 content-page">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
    <div>
      <h1>Book Club Administration</h1>
      <p class="lead mb-0">Room management</p>
    </div>
    <a class="btn btn-outline-dark" routerLink="/group-admin-dashboard">
      Return to dashboard
    </a>
  </div>

  <nav class="admin-tabs mb-4" aria-label="Group administration sections">
    <button class="btn btn-outline-dark" type="button">Overview</button>
    <button class="btn btn-outline-dark" type="button">Settings</button>
    <button class="btn btn-outline-dark" type="button">Members</button>
    <button class="btn btn-outline-dark active-tab" type="button" aria-current="page">Rooms</button>
    <a class="btn btn-outline-dark" [routerLink]="['/groups', groupId, 'requests']">
      Requests
    </a>
  </nav>

  @if (roomMessage) {
    <div class="alert alert-success" role="status">{{ roomMessage }}</div>
  }

  <div class="row g-4">
    <section class="col-lg-8" aria-labelledby="managed-rooms-heading">
      <div class="card content-card">
        <div class="card-body">
          <h2 id="managed-rooms-heading" class="h4">Rooms</h2>

          <div class="table-responsive">
            <table class="table table-bordered align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th scope="col">Room</th>
                  <th scope="col">Description</th>
                  <th scope="col">Actions</th>
                </tr>
              </thead>
              <tbody>
                @for (room of rooms; track room.id) {
                  <tr>
                    <td>{{ room.name }}</td>
                    <td>{{ room.description }}</td>
                    <td>
                      <div class="d-flex flex-wrap gap-2">
                        <a
                          class="btn btn-outline-dark btn-sm"
                          [routerLink]="['/groups', groupId, 'rooms', room.id]"
                        >
                          Open
                        </a>
                        <button class="btn btn-outline-dark btn-sm" type="button">Edit</button>
                        <button
                          class="btn btn-outline-dark btn-sm"
                          type="button"
                          (click)="deleteRoom(room.id)"
                        >
                          Delete
                        </button>
                      </div>
                    </td>
                  </tr>
                } @empty {
                  <tr>
                    <td colspan="3">This group has no rooms.</td>
                  </tr>
                }
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </section>

    <section class="col-lg-4" aria-labelledby="create-room-heading">
      <div class="card content-card">
        <div class="card-body">
          <h2 id="create-room-heading" class="h4">Create a room</h2>

          <form (ngSubmit)="createRoom()">
            <div class="mb-3">
              <label class="form-label" for="room-name">Room name</label>
              <input
                id="room-name"
                class="form-control"
                name="roomName"
                [(ngModel)]="newRoom.name"
                required
              />
            </div>

            <div class="mb-3">
              <label class="form-label" for="room-description">Description</label>
              <textarea
                id="room-description"
                class="form-control"
                name="roomDescription"
                rows="3"
                [(ngModel)]="newRoom.description"
                required
              ></textarea>
            </div>

            <button class="btn btn-outline-dark" type="submit">Create room</button>
          </form>
        </div>
      </div>
    </section>
  </div>
</main>
