<app-main-navigation />

<main class="container py-4 profile-page">
  <section class="card content-card" aria-labelledby="profile-heading">
    <div class="card-body p-4">
      <h1 id="profile-heading" class="h2 mb-4">My Profile</h1>

      <div class="profile-image-section mb-4">
        <div class="profile-avatar" aria-label="Current profile image">
          {{ profileInitial }}
        </div>
        <button
          class="btn btn-outline-dark"
          type="button"
          [disabled]="profileLoading"
          (click)="showImageMessage()"
        >
          Change image
        </button>
      </div>

      <form (ngSubmit)="saveProfile()">
        <div class="row g-3">
          <div class="col-sm-6">
            <label class="form-label" for="profile-first-name">First name</label>
            <input
              id="profile-first-name"
              class="form-control"
              name="firstName"
              [(ngModel)]="profile.firstName"
              required
            />
          </div>

          <div class="col-sm-6">
            <label class="form-label" for="profile-last-name">Last name</label>
            <input
              id="profile-last-name"
              class="form-control"
              name="lastName"
              [(ngModel)]="profile.lastName"
              required
            />
          </div>

          <div class="col-sm-6">
            <label class="form-label" for="profile-username">Username</label>
            <input
              id="profile-username"
              class="form-control"
              name="username"
              [(ngModel)]="profile.username"
              required
            />
          </div>

          <div class="col-sm-6">
            <label class="form-label" for="profile-birthdate">Birthdate</label>
            <input
              id="profile-birthdate"
              class="form-control"
              type="date"
              name="birthdate"
              [(ngModel)]="profile.birthdate"
              required
            />
          </div>

          <div class="col-12">
            <label class="form-label" for="profile-email">Email</label>
            <input
              id="profile-email"
              class="form-control read-only-field"
              type="email"
              [value]="email"
              readonly
            />
            <div class="form-text">Email cannot be changed.</div>
          </div>
        </div>

        @if (profileMessage) {
          <div class="alert alert-success mt-3 mb-0" role="status">{{ profileMessage }}</div>
        }
        @if (profileError) {
          <div class="alert alert-danger mt-3 mb-0" role="alert">{{ profileError }}</div>
        }

        <div class="d-flex flex-wrap gap-2 mt-4">
          <button
            class="btn btn-outline-dark"
            type="submit"
            [disabled]="profileLoading || profileSaving"
          >
            {{ profileSaving ? 'Saving...' : 'Save changes' }}
          </button>
          <button
            class="btn btn-outline-dark"
            type="button"
            [disabled]="profileLoading"
            (click)="togglePasswordForm()"
          >
            {{ showPasswordForm ? 'Cancel password change' : 'Change password' }}
          </button>
        </div>
      </form>

      @if (showPasswordForm) {
        <hr class="my-4" />

        <form (ngSubmit)="changePassword()">
          <h2 class="h4 mb-3">Change password</h2>

          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label" for="current-password">Current password</label>
              <input
                id="current-password"
                class="form-control"
                type="password"
                name="currentPassword"
                [(ngModel)]="passwordDetails.currentPassword"
                autocomplete="current-password"
                required
              />
            </div>

            <div class="col-md-4">
              <label class="form-label" for="new-password">New password</label>
              <input
                id="new-password"
                class="form-control"
                type="password"
                name="newPassword"
                [(ngModel)]="passwordDetails.newPassword"
                autocomplete="new-password"
                minlength="8"
                required
              />
            </div>

            <div class="col-md-4">
              <label class="form-label" for="confirm-password">Confirm new password</label>
              <input
                id="confirm-password"
                class="form-control"
                type="password"
                name="confirmPassword"
                [(ngModel)]="passwordDetails.confirmPassword"
                autocomplete="new-password"
                minlength="8"
                required
              />
            </div>
          </div>

          @if (passwordMessage) {
            <div class="alert alert-success mt-3 mb-0" role="status">
              {{ passwordMessage }}
            </div>
          }
          @if (passwordError) {
            <div class="alert alert-danger mt-3 mb-0" role="alert">
              {{ passwordError }}
            </div>
          }

          <button
            class="btn btn-outline-dark mt-3"
            type="submit"
            [disabled]="passwordSaving"
          >
            {{ passwordSaving ? 'Changing...' : 'Save new password' }}
          </button>
        </form>
      }
    </div>
  </section>
</main>
