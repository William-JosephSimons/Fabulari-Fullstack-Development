<header class="fabulari-header">
  <div class="fabulari-brand">
    <a routerLink="/user-dashboard" aria-label="Go to user dashboard">
      <img src="/images/fabulari-logo.png" alt="Fabulari - where communities meet" />
    </a>
  </div>

  <nav class="fabulari-nav" aria-label="Main navigation">
    <a routerLink="/user-dashboard" routerLinkActive="active">User dashboard</a>
    <a routerLink="/group-admin-dashboard" routerLinkActive="active">
      Group Administrator dashboard
    </a>
    <a routerLink="/groups" routerLinkActive="active">Groups</a>
    <a routerLink="/requests" routerLinkActive="active">Requests</a>
    <a routerLink="/profile" routerLinkActive="active">Profile</a>
    <button type="button" (click)="logout()">Logout</button>
  </nav>
</header>
