<app-super-admin-navigation />

<main class="container py-4 content-page">
  <h1 class="mb-4">Audit Logs</h1>

  <section class="card content-card" aria-labelledby="audit-log-heading">
    <div class="card-body">
      <h2 id="audit-log-heading" class="h4">Administrative activity</h2>

      <form class="row g-3 align-items-end mb-4" (ngSubmit)="applyFilters()">
        <div class="col-md-4">
          <label class="form-label" for="action-type">Action type</label>
          <select
            id="action-type"
            class="form-select"
            name="actionType"
            [(ngModel)]="selectedActionType"
          >
            <option value="all">All actions</option>
            <option value="groupApproved">Group approved</option>
            <option value="roomCreated">Room created</option>
            <option value="groupChanged">Group changed</option>
            <option value="requestRejected">Request rejected</option>
          </select>
        </div>

        <div class="col-md-3">
          <label class="form-label" for="start-date">From</label>
          <input
            id="start-date"
            class="form-control"
            type="date"
            name="startDate"
            [(ngModel)]="selectedStartDate"
          />
        </div>

        <div class="col-md-3">
          <label class="form-label" for="end-date">To</label>
          <input
            id="end-date"
            class="form-control"
            type="date"
            name="endDate"
            [(ngModel)]="selectedEndDate"
          />
        </div>

        <div class="col-md-2 d-grid">
          <button class="btn btn-outline-dark" type="submit">Apply filters</button>
        </div>
      </form>

      <div class="table-responsive">
        <table class="table table-bordered align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th scope="col">Date and time</th>
              <th scope="col">Actor</th>
              <th scope="col">Action</th>
              <th scope="col">Details</th>
            </tr>
          </thead>
          <tbody>
            @for (log of filteredAuditLogs; track log.dateTime) {
              <tr>
                <td>{{ log.dateTime }}</td>
                <td>{{ log.actor }}</td>
                <td>{{ log.action }}</td>
                <td>{{ log.details }}</td>
              </tr>
            } @empty {
              <tr>
                <td colspan="4">No audit logs match the selected filters.</td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
  </section>
</main>
